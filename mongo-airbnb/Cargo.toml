[package]
name = "mongo-airbnb"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
log = "0.4.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
schemars = "0.8.21"
reqwest = { version = "0.12.9", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
thiserror = "2.0.12"
async-stream = "0.3.6"
base64 = "0.22.1"

mongodb = "3.2.3"
tokio = { version = "1.44.2", features = ["full"] }